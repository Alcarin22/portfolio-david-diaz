<header class="nav-shell">
  <nav class="container nav" aria-label="Navegación principal">
    <a class="brand" routerLink="/" fragment="inicio" (click)="close()">
      <span class="monogram">DD</span>
      David Díaz<span style="color: var(--accent)">.</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-controls="main-menu"
      [attr.aria-expanded]="open()"
      (click)="open.set(!open())"
    >
      {{ open() ? 'Cerrar' : 'Menú' }}
    </button>

    <div id="main-menu" class="nav-links" [class.open]="open()" (keydown.escape)="close()">
      <a routerLink="/" fragment="proyectos" (click)="close()">Proyectos</a>
      <a routerLink="/" fragment="sobre-mi" (click)="close()">Sobre mí</a>
      <a routerLink="/" fragment="experiencia" (click)="close()">Experiencia</a>
      <a class="extra" routerLink="/" fragment="tecnologias" (click)="close()">Tecnologías</a>
      <a class="btn btn-primary" routerLink="/" fragment="contacto" (click)="close()">
        Hablemos <span aria-hidden="true">↗</span>
      </a>
    </div>
  </nav>
</header>
